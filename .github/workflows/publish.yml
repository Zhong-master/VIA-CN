name: Publish to npm

# 通过 npm Trusted Publishing (OIDC) 发布，全程不需要任何 npm 令牌。
#
# 前置条件（只需做一次）：
#   1. 包首次发布必须手动完成（npm 只允许对“已存在”的包配置 Trusted Publisher）
#   2. 在 npmjs.com → 该包 → Settings → Trusted Publisher 中配置：
#        Publisher:        GitHub Actions
#        Organization/user: Zhong-master
#        Repository:        VIA-CN
#        Workflow filename: publish.yml        （只写文件名，不要带 .github/workflows/）
#        Allowed actions:   npm publish
#
# 完成上述两步后，改 package.json 版本号并推送同名 tag 即可自动发布：
#   git tag v3.0.14 && git push origin v3.0.14

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: '要发布的 git ref（例如 refs/tags/v3.0.14）；留空则使用当前 ref'
        required: false
        type: string

permissions:
  contents: read
  id-token: write     # OIDC 必需：缺少它 npm 无法验证发布来源

jobs:
  publish:
    name: Publish (trusted publishing)
    runs-on: ubuntu-latest
    # 如果你在 npmjs.com 的 Trusted Publisher 里填了 “Environment name”，
    # 就把下面这行取消注释并改成同名；两边必须一致，否则发布会失败。
    # 没填则保持注释状态。
    # environment: npm

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'                                  # OIDC 可信发布要求 Node >= 22.14
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # 本包零依赖、无 lockfile，因此不执行 npm ci / npm install

      - name: 检查 npm CLI 版本（OIDC 要求 >= 11.5.1）
        run: |
          node -e '
            const cur = require("child_process").execSync("npm -v").toString().trim();
            const a = cur.split(".").map(Number);
            const need = [11, 5, 1];
            const ok = a[0] > need[0] ||
                       (a[0] === need[0] && (a[1] > need[1] ||
                       (a[1] === need[1] && a[2] >= need[2])));
            console.log("npm CLI " + cur);
            if (!ok) { console.error("npm CLI 过旧，可信发布需要 >= 11.5.1"); process.exit(1); }
          '

      - name: 校验 tag 与 package.json 版本一致
        run: |
          REF="${{ inputs.ref || github.ref }}"
          case "$REF" in
            refs/tags/v*) ;;
            *) echo "非 tag 触发（$REF），跳过版本一致性校验"; exit 0 ;;
          esac
          TAG="${REF#refs/tags/v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag = $TAG / package.json = $PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG 与 package.json 的 $PKG 不一致，请先同步版本号"
            exit 1
          fi

      - name: 预检（语法 + 打包内容）
        run: |
          for f in js/*.js index.js bin/serve.js; do node --check "$f"; done
          echo "语法检查通过"
          npm pack --dry-run

      - name: Publish
        # 不要在这里注入 NODE_AUTH_TOKEN / NPM_TOKEN：
        # npm 会用 GitHub 提供的 OIDC 令牌完成认证，并自动生成 provenance 证明。
        run: npm publish --access public --provenance
